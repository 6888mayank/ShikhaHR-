    <rect x="157" y="57" width="181" height="101" rx="4" fill="#D87A00"/>
    <!-- Chart bars inside board - white bars -->
    <rect x="175" y="130" width="14" height="10" fill="white"/>
    <rect x="198" y="122" width="14" height="18" fill="white"/>
    <rect x="221" y="110" width="14" height="30" fill="white"/>
    <rect x="244" y="98" width="14" height="42" fill="white"/>
    <rect x="267" y="85" width="14" height="55" fill="white"/>
