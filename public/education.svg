    <rect x="62" y="105" width="56" height="110" rx="14"/>
    <!-- Tie -->
    <polygon points="90,108 82,125 90,135 98,125" fill="white"/>
    <rect x="86" y="135" width="8" height="28" fill="white"/>
    <!-- Arms -->
    <rect x="42" y="115" width="18" height="85" rx="9"/>
    <rect x="118" y="125" width="52" height="18" rx="9" transform="rotate(-15 144 134)"/>
