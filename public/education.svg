      <circle cx="70" cy="255" r="24"/>
      <path d="M 30 325 L 30 295 Q30 275 70 275 Q110 275 110 295 L110 325 L 95 325 L95 310 L45 310 L45 325 Z"/>
      <!-- Middle -->
